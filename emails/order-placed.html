<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Your Order Confirmation</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #222; background: #f4f4f4; margin: 0; padding: 24px;">
    <div style="max-width: 600px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 32px;">
      
      <div style="font-size: 1.5em; font-weight: bold; margin-bottom: 8px;">Thank you for your order, {{customerName}}!</div>
      <p style="margin-top: 0; color: #555;">Order <strong>#{{orderId}}</strong> has been placed successfully.</p>

      <h3 style="border-bottom: 1px solid #eee; padding-bottom: 8px;">Order Summary</h3>

      {{itemsHTML}}

      <p style="margin-top: 24px;">We'll notify you when your order ships.</p>

      <div style="margin-top: 32px; font-size: 0.85em; color: #999;">
        &copy; Powell Shirts
      </div>
    </div>
  </body>
</html>
